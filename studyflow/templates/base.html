<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}StudyFlow{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><a class="skip-link" href="#main-content">Skip to content</a><header><a class="brand" href="{{ url_for('main.dashboard') }}"><span class="brand-mark">S</span>StudyFlow<span class="brand-sub">PLANNER</span></a>{% if g.user %}<nav aria-label="Main navigation"><a href="{{ url_for('main.dashboard') }}">Dashboard</a><a href="{{ url_for('inputs.targets') }}">Feedback & Targets</a><a href="{{ url_for('plan.plan') }}">Study Plan</a><a href="{{ url_for('main.progress') }}">Progress</a><a href="{{ url_for('inputs.settings') }}">Settings</a></nav><form action="{{ url_for('auth.logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="quiet">Log out</button></form>{% endif %}</header>
<main id="main-content">{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>A little structure. More room to learn.</footer></body></html>
